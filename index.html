<meta name="apple-mobile-web-app-title" content="楠城小工具">
<style>
:root{--bg:#121315;--panel:#1b1c1f;--line:#2f3035;--fg:#ececee;--mute:#9b9ca3;--acc:#b3121b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:min(340px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.logo{display:block;width:88px;height:88px;margin:0 auto 12px;filter:drop-shadow(0 4px 14px rgba(179,18,27,.35))}
h1{margin:0 0 4px;font-size:20px;letter-spacing:.04em}
.sub{color:var(--mute);font-size:13px;margin-bottom:18px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#121315;color:var(--fg);font-size:16px;text-align:center;letter-spacing:.2em;outline:none}
input:focus{border-color:var(--acc)}
button{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#err{min-height:20px;margin-top:10px;font-size:13px;color:#ff9b8f}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#lv{position:fixed;right:10px;bottom:10px;padding:5px 11px;border-radius:999px;border:1px solid #3a3b41;background:#1b1c1f;color:#a7a8ae;font:600 12px/1.2 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hide{display:none!important}
</style>

<script>
/* ============================================================
   楠城設計小工具：共用下載模組（NC）
   ------------------------------------------------------------
   所有工具的下載都交給這裡處理，工具本身不必知道自己在哪裡被打開：
   - 用 claude.ai 連結開啟：走 claude.ai 的下載功能。
     它只接受特定副檔名，其他格式（例如 .tif、.stl）自動打包成 .zip。
   - 用 HTML 檔開啟（或放在自己的網站）：
     iOS 走系統分享面板（可直接存進相簿），其他裝置用一般下載。
   工具在框架裡時，會往上層找到同一個 NC，所以整個程式只有一份。
   ============================================================ */
(function () {
  function findUp() {
    let w = window;
    for (let i = 0; i < 8; i++) {
      try { if (w !== window && w.NC) return w.NC; } catch (e) { return null; }
      if (w.parent === w) break;
      w = w.parent;
    }
    return null;
  }
  const up = findUp();
  if (up) { window.NC = up; return; }

  // claude.ai 下載功能接受的副檔名
  const ALLOW = new Set('gif png jpg jpeg webp mp4 webm mov txt json md docx pptx epub csv ttf html svg pdf xlsx zip fig'.split(' '));

  let dlPromise = null;
  async function getDl() {
    if (!(window.claude && window.claude.use)) return null;          // 不在 claude.ai 裡
    if (!dlPromise) dlPromise = window.claude.use('downloads').catch(() => null);
    return Promise.race([dlPromise, new Promise(r => setTimeout(() => r(null), 4000))]);
  }

  // ---- 不壓縮的 ZIP（單一檔案）----
  const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zipOne(name, data) {
    const nm = new TextEncoder().encode(name), crc = crc32(data), L = data.length;
    const lh = new DataView(new ArrayBuffer(30)); lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, L, true); lh.setUint32(22, L, true); lh.setUint16(26, nm.length, true);
    const ch = new DataView(new ArrayBuffer(46)); ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, L, true); ch.setUint32(24, L, true); ch.setUint16(28, nm.length, true);
    const ed = new DataView(new ArrayBuffer(22)); ed.setUint32(0, 0x06054b50, true); ed.setUint16(8, 1, true); ed.setUint16(10, 1, true);
    ed.setUint32(12, 46 + nm.length, true); ed.setUint32(16, 30 + nm.length + L, true);
    return new Blob([lh.buffer, nm, data, ch.buffer, nm, ed.buffer], { type: 'application/zip' });
  }

  // ---- 提示訊息（畫在最上層，任何工具裡都看得到）----
  let toastEl = null, toastTimer = null;
  function toast(text, isErr) {
    if (!document.body) return;
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:2147483000;' +
        'max-width:calc(100vw - 24px);padding:9px 16px;border-radius:999px;font:600 13px/1.4 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;' +
        'box-shadow:0 6px 20px rgba(0,0,0,.35);transition:opacity .25s;pointer-events:none;';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = text;
    toastEl.style.background = isErr ? '#7a2a22' : '#1f3a2c';
    toastEl.style.color = isErr ? '#ffd9d3' : '#c9f2db';
    toastEl.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 3200);
  }

  function isIOS() {
    return /iP(hone|ad|od)/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  // 檔案模式：iOS 分享面板／一般下載（沿用貼紙生成器的作法）
  async function deliverFile(blob, filename, mime) {
    if (isIOS() && navigator.share && navigator.canShare) {
      try {
        const file = new File([blob], filename, { type: mime });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file] });
          return { ok: true, name: filename };
        }
      } catch (err) {
        if (err && err.name === 'AbortError') return { ok: false, declined: true };
      }
    }
    const url = URL.createObjectURL(blob);
    if (isIOS()) {
      const win = window.open(url, '_blank');
      toast(win ? '已在新分頁開啟，請長按檔案儲存' : '請允許彈出視窗，或改用電腦下載', !win);
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return { ok: !!win, name: filename, silent: true };
    }
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return { ok: true, name: filename };
  }

  /**
   * 下載檔案。data 可以是 Blob、Uint8Array、ArrayBuffer 或字串。
   * 回傳 { ok, name, zipped, declined, error }，並自動顯示提示。
   */
  async function save(data, filename, mime) {
    mime = mime || 'application/octet-stream';
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    let res;
    try {
      const dl = await getDl();
      if (dl) {
        let name = filename, payload = blob, zipped = false;
        const ext = (name.split('.').pop() || '').toLowerCase();
        if (!ALLOW.has(ext)) {
          payload = zipOne(name, new Uint8Array(await blob.arrayBuffer()));
          name = name.replace(/\.[^.]+$/, '') + '.zip';
          zipped = true;
        }
        try {
          await dl.save({ filename: name, data: payload });
          res = { ok: true, name, zipped };
        } catch (e) {
          res = (e && e.code === 'declined') ? { ok: false, declined: true }
              : { ok: false, error: (e && (e.message || e.code)) || String(e) };
        }
      } else {
        res = await deliverFile(blob, filename, mime);
      }
    } catch (e) {
      res = { ok: false, error: (e && e.message) || String(e) };
    }
    if (!res.silent) {
      if (res.ok) toast(res.zipped ? `已下載 ${res.name}（.${filename.split('.').pop()} 已打包成 zip）` : `已下載 ${res.name}`);
      else if (res.declined) toast('已取消下載');
      else toast('下載失敗：' + (res.error || ''), true);
    }
    return res;
  }

  window.NC = { save, toast, zipOne };
})();

function b64(s) { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

async function unlock(pw) {
  if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return new TextDecoder().decode(plain);
}

function showApp(html) {
  const f = document.createElement('iframe');
  f.id = 'app';
  f.title = '楠城設計小工具';
  f.setAttribute('allow', 'clipboard-write');
  f.srcdoc = html;
  document.body.appendChild(f);
  document.getElementById('login').classList.add('hide');
  document.getElementById('lv').classList.add('hide');
}

// 鎖定：移除已解密的程式，回到密碼畫面
window.NC_LOCK = function () {
  const f = document.getElementById('app');
  if (f) f.remove();
  document.getElementById('login').classList.remove('hide');
  document.getElementById('lv').classList.remove('hide');
  const pw = document.getElementById('pw');
  pw.value = ''; pw.focus();
};

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
  if (!pw.value) { err.textContent = '請輸入密碼'; return; }
  go.disabled = true; go.textContent = '解鎖中…'; err.textContent = '';
  try {
    showApp(await unlock(pw.value));
  } catch (ex) {
    err.textContent = (ex && ex.message === 'nocrypto')
      ? '這個瀏覽器不支援解密，請改用新版 Chrome／Safari'
      : '密碼錯誤，請再試一次';
    pw.select();
  } finally {
    go.disabled = false; go.textContent = '進入';
  }
});
</script>
