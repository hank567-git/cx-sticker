  const ITERATIONS=300000;
  function b64ToBytes(b64){const bin=atob(b64);const a=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  const pwInput=document.getElementById('pw'), goBtn=document.getElementById('go'), msg=document.getElementById('msg');
  async function tryUnlock(){
    const password=pwInput.value; if(!password) return;
    goBtn.disabled=true; pwInput.disabled=true;
    msg.style.color='#98a1aa'; msg.textContent='解密中…';
    try {
      const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);

      goBtn.disabled=false; pwInput.disabled=false; pwInput.value=''; pwInput.focus();
