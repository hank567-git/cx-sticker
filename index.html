<meta name="apple-mobile-web-app-title" content="CX貼紙生成器">
<style>
  /* ===== 主題色彩變數 =====
     淺色為預設；深色由 body.dark 覆寫。
     所有介面顏色都走變數，切換時不必逐條改樣式。
     注意：畫布內繪製的白色紙張背景不受主題影響——那是輸出內容，不是介面。 */
  :root {
    --bg: #eef2f5;
    --panel: #ffffff;
    --panel-2: #f8f9fa;
    --border: #dddddd;
    --border-2: #e9ecef;
    --text: #333333;
    --text-2: #495057;
    --muted: #6c757d;
    --tab-bg: #e9ecef;
    --input-bg: #ffffff;
    --input-border: #cccccc;
    --accent: #007bff;
    --accent-bg: #e7f1ff;
    --accent-border: #b6d4fe;
    --warn-bg: #fff8e1;
    --warn-border: #ffe082;
    --ok-bg: #d1e7dd;
    --ok-border: #a3cfbb;
    --ok-text: #0f5132;
    --danger-text: #c9302c;
    --shadow: rgba(0,0,0,0.1);
  }
  body.dark {
    --bg: #15181c;
    --panel: #1f242a;
    --panel-2: #272d34;
    --border: #3a424a;
    --border-2: #333a42;
    --text: #e4e7ea;
    --text-2: #c2c8ce;
    --muted: #98a1aa;
    --tab-bg: #2f363e;
    --input-bg: #2a3138;
    --input-border: #4a535c;
    --accent: #4d9fff;
    --accent-bg: #1b2c40;
    --accent-border: #2f4d6e;
    --warn-bg: #3a3520;
    --warn-border: #6b5f2e;
    --ok-bg: #1e3a2c;
    --ok-border: #2f5f47;
    --ok-text: #a6e0c0;
    --danger-text: #ff8a80;
    --shadow: rgba(0,0,0,0.5);
  }

  #eggToast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translate(-50%, -14px);
    z-index: 9999;
    background: linear-gradient(135deg, #6f42c1, #4d9fff);
    color: #fff;
    padding: 13px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 6px 22px rgba(0,0,0,0.35);
    white-space: nowrap;
    max-width: calc(100vw - 24px);
    overflow: hidden;
    text-overflow: ellipsis;
    /* 預設隱藏；不用 display:none 才能有淡入淡出動畫 */
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease, visibility .3s;
  }
  #eggToast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }

  * { box-sizing: border-box; touch-action: manipulation; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: background .2s, color .2s; padding: 15px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
  .container { display: flex; flex-wrap: wrap; gap: 20px; background: var(--panel); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px var(--shadow); max-width: 900px; width: 100%; align-items: flex-start; }

  .tab-group { display: flex; width: 100%; gap: 10px; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 10px; }
  .tab-btn { flex: 1; padding: 10px; border: none; background: var(--tab-bg); border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; color: var(--text-2); }
  .tab-btn.active { background: var(--accent); color: #fff; }

  .controls { flex: 1; min-width: min(300px, 100%); display: flex; flex-direction: column; gap: 9px; }
  .preview-area { flex: 1; min-width: min(320px, 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--panel-2); padding: 15px; border-radius: 8px; overflow: hidden; position: sticky; top: 10px; z-index: 10; }

  h2 { margin: 0 0 5px 0; font-size: 18px; color: var(--text); border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
  .control-group { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 13px; font-weight: 600; color: var(--text-2); }
  input[type="file"], input[type="range"], select { width: 100%; cursor: pointer; }

  /* 色票：iOS Safari 會把 input[type=color] 畫成橢圓膠囊並加上系統裝飾色塊，
     必須關掉原生外觀並自行處理 WebKit 的 swatch 偽元素，才能跟電腦端一致 */
  input[type="color"] {
    width: 100%;
    height: 32px;
    cursor: pointer;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background: none;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    padding: 3px;
    overflow: hidden;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; border-radius: 4px; }
  input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
  input[type="color"]::-moz-color-swatch { border: none; border-radius: 4px; }

  .color-pickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .color-item { display: flex; flex-direction: row; align-items: center; gap: 5px; font-size: 12px; }
  .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: var(--danger-text); cursor: pointer; margin-top: 2px; }
  .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }

  canvas { border: 1px solid var(--border); background: #fff; box-shadow: 0 2px 8px var(--shadow); cursor: move; max-width: 100%; height: auto; touch-action: none; }
  canvas.single-mode { border-radius: 50%; }

  /* ---- 手機版調整 ---- */
  @media (max-width: 700px) {
    body { padding: 8px; }
    /* ===== 方案 A：預覽區釘在畫面頂端 =====
       調整下方拉桿時仍能看到貼紙效果。
       關鍵：在「換行」的 flex 容器裡，sticky 元素只能在自己那一行內
       吸附（等於沒有作用）。改成單列的縱向 flex，讓容器本身很高、
       預覽是第一個項目，sticky 才會正常運作。 */
    .container {
      padding: 12px;
      gap: 12px;
      flex-direction: column;
      flex-wrap: nowrap;
      align-items: stretch;
    }
    .preview-area {
      order: -1;
      width: 100%;
      padding: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      /* 捲動時要蓋住下方內容，不能透出 */
      background: var(--panel-2);
      box-shadow: 0 3px 8px var(--shadow);
      /* 限制高度，避免吃掉太多操作空間 */
      max-height: 40vh;
    }
    .preview-area canvas {
      max-height: calc(40vh - 20px);
      max-width: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    .controls { width: 100%; }
    /* 加大觸控目標，避免手指難按 */
    button { padding: 12px; font-size: 14px; }
    .tab-btn { padding: 12px 6px; font-size: 13px; }
    input[type="range"] { height: 28px; }
    .color-item input[type="color"] { height: 40px; }

    /* iOS Safari 在 font-size < 16px 的輸入框獲得焦點時會自動放大整頁，
       且不會自動縮回，體感像是版面壞掉。所有可輸入元素一律 >= 16px。
       使用 !important 是因為這些元素帶有行內 style，優先權高於一般規則。 */
    input[type="number"],
    input[type="text"],
    select {
      font-size: 16px !important;
    }
    .number-input-wrap input[type="number"] {
      padding: 8px 6px !important;
      width: 68px !important;
    }
    .send-box select { padding: 10px; }

    /* 裁切線顏色鈕在桌機是小尺寸行內樣式，手機上放大到易點擊的大小 */
    #cutLineOptions button,
    #proofBlackBtn, #proofOrangeBtn, #proofCyanBtn, #proofWhiteBtn {
      padding: 11px 18px !important;
      font-size: 14px !important;
    }
    #clearImgBtn { padding: 10px 14px !important; font-size: 13px !important; }

    /* ---- 微調區塊緊湊化：讓預覽能留在畫面內 ---- */
    /* 維持 2 欄（改單欄會變成 4 列，反而更高），改為壓縮每格的內部間距 */
    .quad-grid { gap: 6px; }
    .quad-item { padding: 5px 6px; }
    /* 標籤列與滑桿之間的間距（HTML 為行內樣式，需 important 覆蓋） */
    .quad-item > div { margin-bottom: 2px !important; }
    .quad-item input[type="range"] { height: 24px; }
    /* 數字框維持 16px 字級避免 iOS 縮放，改以壓低內距來省高度 */
    .quad-item .number-input-wrap input[type="number"] {
      padding: 2px 6px !important;
      width: 56px !important;
    }
    .align-btn-group { margin-bottom: 2px; }
    .align-btn-group button { padding: 8px 4px !important; font-size: 13px !important; }
  }

  .quad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
  .quad-item { background: var(--panel-2); padding: 8px; border-radius: 6px; border: 1px solid var(--border-2); }

  .number-input-wrap { display: flex; align-items: center; gap: 2px; }
  .number-input-wrap input[type="number"] { width: 50px; padding: 2px 4px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text); border-radius: 4px; font-size: 11px; text-align: right; }
  .unit { font-size: 11px; color: var(--muted); font-weight: bold; }

  .align-btn-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 4px; }
  .btn-align { background: #17a2b8; color: white; padding: 6px 4px; font-size: 12px; border-radius: 4px; text-align: center; }

  button { padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .btn-download { width: 100%; background: #28a745; color: white; padding: 12px; font-size: 15px; margin-top: 5px; }
  .btn-primary { background: #007bff; color: white; flex: 1; padding: 10px; margin-top: 0; font-size: 14px; }
  .btn-primary:hover { background: #0056b3; }
  .btn-secondary { background: #17a2b8; color: white; width: 100%; margin-top: 4px; }
  .btn-danger { background: #dc3545; color: white; margin-top: 4px; width: 100%; }
  .btn-reset { background: #6c757d; color: white; width: 100%; margin-top: 5px; }
  .tip { font-size: 11px; color: var(--muted); line-height: 1.3; }

  /* 「將此貼紙發送至」按鈕位於選單左側 */
  .send-box { display: flex; gap: 8px; align-items: center; margin-top: 8px; background: var(--accent-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--accent-border); }
  .send-box select { width: 110px; padding: 8px; border-radius: 6px; font-weight: bold; background: var(--input-bg); color: var(--text); border: 1px solid var(--input-border); }

  .row-list { display: flex; flex-direction: column; gap: 6px; }
  .row-item { display: flex; justify-content: space-between; align-items: center; background: var(--panel-2); padding: 6px 10px; border-radius: 6px; font-size: 12px; border: 1px solid var(--border); }
  .row-status { font-weight: bold; color: #28a745; }
  .row-status.empty { color: var(--muted); font-weight: normal; }
</style>
</head>
<body>

<!-- 彩蛋提示：fixed 定位浮在畫面上方，不受面板捲動位置影響 -->
<div id="eggToast" role="status" aria-live="polite">🎉 找到彩蛋了！已套用品牌 Logo 滿版。</div>

<div class="container">
  <div class="controls">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:2px solid var(--accent); padding-bottom:6px; margin-bottom:5px;">
      <h2 id="appTitle" style="border:none; padding:0; margin:0; cursor:default; user-select:none; -webkit-user-select:none;">CX紋章貼紙生成器</h2>
      <button id="themeBtn" title="切換淺色／深色" style="width:auto; flex:none; padding:6px 10px; margin:0; font-size:16px; line-height:1; background:var(--tab-bg); color:var(--text-2); border:1px solid var(--border); border-radius:6px;">🌙</button>
    </div>

    <div class="tab-group">
      <button id="tabSingle" class="tab-btn active">單貼紙微調編輯</button>
      <button id="tabSheet" class="tab-btn">4x6 排版預覽與下載</button>
    </div>

    <div id="singlePanel">
      <div class="control-group" id="frameTypeSection" style="flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap;">
        <label style="flex:none;">1. 樣式</label>
        <div class="align-btn-group" style="flex:1; margin:0; grid-template-columns:repeat(3,1fr);">
          <button id="frameRightBtn" class="btn-align">右迴旋</button>
          <button id="frameLeftBtn" class="btn-align">左迴旋</button>
          <button id="frameNoneBtn" class="btn-align">全圖模式</button>
        </div>
        <!-- 保留為隱藏欄位：全圖模式狀態由此驅動，多處繪製邏輯讀取它 -->
        <input type="checkbox" id="hideFrameCheck" style="display:none;">
      </div>

      <div class="control-group" id="colorSection" style="flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap;">
        <label style="flex:none;">2. 外框調色</label>
        <div class="color-pickers" style="flex:1;">
          <div class="color-item">
            <input type="color" id="redColor" value="#FF0000" title="紅色區">
          </div>
          <div class="color-item">
            <input type="color" id="blackColor" value="#000000" title="黑色區">
          </div>
          <div class="color-item">
            <input type="color" id="whiteColor" value="#FFFFFF" title="白色區">
          </div>
        </div>
      </div>

      <div class="control-group" style="flex-direction:row; align-items:center; gap:8px; flex-wrap:wrap;">
        <label style="flex:none;">3. 圖片</label>
        <div style="display:flex; gap:8px; align-items:center; flex:1; min-width:0;">
          <input type="file" id="imageInput" accept="image/*" style="flex:1; min-width:0;">
          <button id="clearImgBtn" class="btn-danger" style="width:auto; flex:none; padding:6px 10px; font-size:12px; margin:0;">刪除</button>
        </div>
      </div>

      <div class="control-group">
        <div style="display:flex; align-items:center; gap:8px;">
          <label style="flex:none;">4. 微調</label>
          <div class="align-btn-group" style="flex:1; margin:0;">
            <button id="alignHBtn" class="btn-align">左右置中</button>
            <button id="alignVBtn" class="btn-align">上下置中</button>
          </div>
        </div>

        <div class="quad-grid">
          <div class="quad-item">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span class="tip">左右位移</span>
              <div class="number-input-wrap">
                <input type="number" id="posXNum" min="-180" max="180" value="0">
                <span class="unit">px</span>
              </div>
            </div>
            <input type="range" id="posXInput" min="-180" max="180" step="1" value="0">
          </div>

          <div class="quad-item">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span class="tip">上下位移</span>
              <div class="number-input-wrap">
                <input type="number" id="posYNum" min="-180" max="180" value="0">
                <span class="unit">px</span>
              </div>
            </div>
            <input type="range" id="posYInput" min="-180" max="180" step="1" value="0">
          </div>

          <div class="quad-item">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span class="tip">圖片縮放</span>
              <div class="number-input-wrap">
                <input type="number" id="scaleNum" min="10" max="300" value="100">
                <span class="unit">%</span>
              </div>
            </div>
            <input type="range" id="scaleInput" min="10" max="300" step="1" value="100">
          </div>

          <div class="quad-item">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span class="tip">圖片旋轉</span>
              <div class="number-input-wrap">
                <input type="number" id="rotateNum" min="0" max="360" value="0">
                <span class="unit">°</span>
              </div>
            </div>
            <input type="range" id="rotateInput" min="0" max="360" step="1" value="0">
          </div>
        </div>
      </div>

      <div class="send-box">
        <button id="sendToSheetBtn" class="btn-primary">將此貼紙發送至</button>
        <select id="targetRowSelect">
          <option value="0">第 1 排</option>
          <option value="1">第 2 排</option>
          <option value="2">第 3 排</option>
          <option value="3">第 4 排</option>
          <option value="4">第 5 排</option>
          <option value="5">第 6 排</option>
          <option value="6">第 7 排</option>
        </select>
      </div>

      <div id="sendToast" style="display:none; background:var(--ok-bg); border:1px solid var(--ok-border); color:var(--ok-text); padding:8px 10px; border-radius:6px; font-size:12px; margin-top:6px;"></div>

      <div class="control-group" style="margin-top:8px;">
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <label class="checkbox-label" style="color:var(--text-2); margin-top:0;">
            <input type="checkbox" id="showPreviewCutCheck" checked>
            預覽顯示裁切線
          </label>
          <button id="proofBlackBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#000000;">黑</button>
          <button id="proofOrangeBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#ff5722;">橘</button>
          <button id="proofCyanBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#00bcd4;">青</button>
          <button id="proofWhiteBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#ffffff; color:#333; border:1px solid #ccc;">白</button>
        </div>
      </div>

      <label class="checkbox-label" style="color:var(--text-2); margin-top:6px;">
        <input type="checkbox" id="watermarkCheck" checked>
        打樣圖加上 N3D LAB 浮水印
      </label>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button id="downloadProofBtn" class="btn-download" style="flex:1; margin:0;">下載單張打樣圖</button>
        <button id="downloadCompareBtn" class="btn-download" style="flex:1; margin:0; background:#6f42c1;">下載三款比較圖</button>
      </div>

      <button id="resetAllBtn" class="btn-reset">重置所有設定</button>
    </div>

    <div id="sheetPanel" style="display:none;">
      <div class="control-group">
        <label>內圈裁切直徑 — 印出來的實際大小（mm）：</label>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="range" id="cutDiaInput" min="10" max="18" step="0.1" value="16.4" style="flex:1;">
          <div class="number-input-wrap">
            <input type="number" id="cutDiaNum" min="10" max="18" step="0.1" value="16.4" style="width:60px;">
            <span class="unit">mm</span>
          </div>
        </div>
        <p class="tip" id="diaInfo"></p>
      </div>

      <div class="control-group">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <label class="checkbox-label" style="color:var(--text-2); margin-top:0;">
            <input type="checkbox" id="showCutLineCheck" checked>
            顯示裁切對位線
          </label>
          <div id="cutLineOptions" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <select id="cutLineShape" style="width:auto; padding:6px 8px; font-size:12px; border-radius:6px; border:1px solid var(--input-border); background:var(--input-bg); color:var(--text);">
              <option value="circle">圓形 16.4mm</option>
              <option value="grid">直線格線</option>
            </select>
            <button id="cutLineBlackBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#000000;">黑</button>
            <button id="cutLineOrangeBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#ff5722;">橘</button>
            <button id="cutLineCyanBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#00bcd4;">青</button>
            <button id="cutLineWhiteBtn" class="btn-secondary" style="width:auto; padding:7px 12px; margin:0; font-size:12px; background:#ffffff; color:#333; border:1px solid #ccc;">白</button>
          </div>
        </div>
        <p class="tip">💡 圓形模式會在每張貼紙畫出 16.4mm 的裁切圓；深色貼紙用淺色線比較看得清楚。</p>
      </div>

      <div class="control-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
          <label>4x6 7排圖案狀態：</label>
          <button id="clearAllRowsBtn" class="btn-danger" style="width:auto; padding:4px 8px; font-size:11px; margin:0;">清空所有排數</button>
        </div>
        <div class="row-list" id="rowStatusContainer"></div>
      </div>
      <p class="tip">💡 提示：在第1頁微調好貼紙後，點擊「將此貼紙發送至」，即可在此頁預覽並導出含對位線的 4x6 列印檔。</p>
      <button id="downloadSheetBtn" class="btn-download">下載 4x6 7-11相片列印檔 (PNG)</button>
    </div>

  </div>

  <div class="preview-area">
    <canvas id="canvas" width="360" height="360" class="single-mode"></canvas>
  </div>
</div>

<script>

  let userImg = null;

  let savedRowCanvases = [null, null, null, null, null, null, null];

  let baseFitScale = 1.0;
  let userScaleMultiplier = 1.0;
  let imgState = { x: 180, y: 180, angle: 0 };
  let isDragging = false;
  let startX, startY;

  let initialPinchDist = null;
  let initialScaleMultiplier = 1.0;

  function updateRowStatusUI() {
    const container = document.getElementById('rowStatusContainer');
    container.innerHTML = '';
    for (let i = 0; i < 7; i++) {
      const div = document.createElement('div');
      div.className = 'row-item';
      const isSet = !!savedRowCanvases[i];
      div.innerHTML = `
        <span>第 ${i + 1} 排 (5張貼紙)：</span>
        <span class="row-status ${isSet ? '' : 'empty'}">${isSet ? '✓ 已派發圖案' : '尚未設定 (留空)'}</span>
        ${isSet ? `<button onclick="clearSingleRow(${i})" style="padding:2px 6px; font-size:11px; background:#dc3545; color:white; border:none; border-radius:4px; cursor:pointer;">清除</button>` : ''}
      `;
      container.appendChild(div);
    }
  }

  window.clearSingleRow = function (idx) {
    savedRowCanvases[idx] = null;
    updateRowStatusUI();
    if (currentMode === 'sheet') draw();
  };

  // ---- 外框切換：右迴旋 / 左迴旋 ----
  // 兩種迴旋是不同設計（非鏡像），各自內嵌一份正式 SVG。
  const FRAMES = {
    right: { label: '右迴旋', svg: FRAME_SVG_RIGHT },
    left:  { label: '左迴旋', svg: FRAME_SVG_LEFT }
  };
  let currentFrameKey = 'right';

  function loadFrame(key) {
    const frame = FRAMES[key];
    if (!frame) return;
    currentFrameKey = key;

    const parser = new DOMParser();
    const svgDoc = parser.parseFromString(frame.svg, "image/svg+xml");
    svgDom = svgDoc.querySelector('svg');
    svgNaturalSize = svgDom ? getSvgNaturalSize(svgDom) : { w: 360, h: 360 };

    // 換外框後，先前偵測到的置中偏移與內圈半徑都已失效
    frameOffsetCache = null;

    updateSvgColorsAndDraw();
  }

  loadFrame('right');

  function getSvgNaturalSize(svgEl) {
    const vb = svgEl.getAttribute('viewBox');
    if (vb) {
      const parts = vb.trim().split(/\s+/).map(Number);
      if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
        return { w: parts[2], h: parts[3] };
      }
    }
    const w = parseFloat(svgEl.getAttribute('width')) || 360;
    const h = parseFloat(svgEl.getAttribute('height')) || 360;
    return { w, h };
  }

  document.getElementById('tabSingle').addEventListener('click', () => {
    currentMode = 'single';
    document.getElementById('tabSingle').classList.add('active');
    document.getElementById('tabSheet').classList.remove('active');
    document.getElementById('singlePanel').style.display = 'block';
    document.getElementById('sheetPanel').style.display = 'none';

    canvas.width = 360;
    canvas.height = 360;
    canvas.classList.add('single-mode');
    draw();
  });

  document.getElementById('tabSheet').addEventListener('click', () => {
    currentMode = 'sheet';
    document.getElementById('tabSheet').classList.add('active');
    document.getElementById('tabSingle').classList.remove('active');
    document.getElementById('singlePanel').style.display = 'none';
    document.getElementById('sheetPanel').style.display = 'block';

    updateRowStatusUI();
    // 4x6 相片比例 = 2:3，預覽畫布採等比例（400 x 600）
    canvas.width = 400;
    canvas.height = 600;
    canvas.classList.remove('single-mode');
    draw();
  });

  document.getElementById('sendToSheetBtn').addEventListener('click', () => {
    const rowSelect = document.getElementById('targetRowSelect');
    const targetRow = parseInt(rowSelect.value);

    const snapshotCanvas = document.createElement('canvas');
    snapshotCanvas.width = 360;
    snapshotCanvas.height = 360;
    const snapCtx = snapshotCanvas.getContext('2d', { willReadFrequently: true });

    drawSingleSticker(snapCtx, 180, 180, 360);

    savedRowCanvases[targetRow] = snapshotCanvas;

    // 自動跳到下一排，連續發送時不用每次手動選；已在第 7 排則停在原地
    const nextRow = targetRow + 1;
    const hasNext = nextRow < 7;
    if (hasNext) rowSelect.value = String(nextRow);

    showSendToast(targetRow, hasNext ? nextRow : null);

    if (currentMode === 'sheet') {
      updateRowStatusUI();
      draw();
    }
  });

  // 用行內提示取代 alert()：alert 會中斷操作、且在手機上每次都要多按一下確定，
  // 連續發送 7 排時特別惱人
  let toastTimer = null;
  function showSendToast(doneRow, nextRow) {

  // ---- 內圈裁切直徑設定（滑桿 + 數字輸入雙向綁定）----

  // ---- 調色：優先用 #red-layer/#black-layer/#white-layer 這類 id，
  //      找不到時 fallback 成依實際顏色值（紅/黑/白）比對替換 ----
  // Rhino 匯出的 SVG 不保留圖層名稱，只能靠顏色值辨識。
  // Rhino 可能輸出 "rgb(255, 0, 0)"（含空格）或 "#FF0000"，此處統一正規化後比對。
  function normalizeColor(v) { return (v || '').trim().toLowerCase().replace(/\s+/g, ''); }
  const RED_SET = new Set(['#ff0000', '#f00', 'red', 'rgb(255,0,0)']);
  const BLACK_SET = new Set(['#000000', '#000', 'black', 'rgb(0,0,0)']);
  const WHITE_SET = new Set(['#ffffff', '#fff', 'white', 'rgb(255,255,255)']);

  function recolorFrameSvg(rootSvg, cRed, cBlack, cWhite) {
    if (!rootSvg) return;
    const handled = new Set();

    // 1) 明確以 id 指定的圖層
    // 相容 Illustrator 的重複圖層命名：同名圖層會被自動改成 red-layer-2、
    // red-layer-3…，並保留 data-name="red-layer"。因此改用「前綴比對」，
    // 讓同色系的多個圖層都能一起套色（例如需要疊在最上層的第二個紅色圖層）。
    // 圖層的上下疊放順序由 SVG 原始文件順序決定，這裡只改顏色、不動順序。
    //
    // Illustrator 若以「內部 CSS」匯出，樣式會寫在 <style> 的 class 裡
    // （常見為 fill:none; stroke:#000，即線稿）。CSS 優先權高於
    // presentation attribute，因此必須先移除 class，改用屬性直接指定顏色，
    // 並把線稿轉成實心填色，才能呈現分區色塊。
    const SHAPE_TAGS = new Set(['path', 'polygon', 'polyline', 'circle', 'ellipse', 'rect', 'line']);
    let layerFound = false;

    [['red-layer', cRed], ['black-layer', cBlack], ['white-layer', cWhite]].forEach(([base, color]) => {
      const groups = rootSvg.querySelectorAll(`[id^="${base}"], [data-name^="${base}"]`);
      groups.forEach(el => {
        layerFound = true;
        const nodes = [el, ...el.querySelectorAll('*')];
        nodes.forEach(node => {
          handled.add(node);
          if (!SHAPE_TAGS.has(node.tagName.toLowerCase())) return;
          node.removeAttribute('class');
          node.removeAttribute('style');
          node.setAttribute('fill', color);
          node.setAttribute('stroke', 'none');
        });
      });
    });

    // 圖層已直接指定顏色，殘留的 <style> 規則只會干擾（例如把 fill 蓋回 none）
    if (layerFound) {
      rootSvg.querySelectorAll('style').forEach(node => node.remove());
    }

    // 2) fallback：依實際顏色值比對
    //    （Rhino 匯出的 SVG 沒有圖層 id，只能靠純紅/純黑/純白的顏色值辨識）
    const pickColor = (v) => {
      const c = normalizeColor(v);
      if (RED_SET.has(c)) return cRed;
      if (BLACK_SET.has(c)) return cBlack;
      if (WHITE_SET.has(c)) return cWhite;
      return null;
    };

    rootSvg.querySelectorAll('*').forEach(el => {
      if (handled.has(el)) return;

      ['fill', 'stroke'].forEach(attr => {
        const newColor = pickColor(el.getAttribute(attr));
        if (newColor) el.setAttribute(attr, newColor);
      });

      // 有些工具（含部分 Rhino 版本／經 Illustrator 轉存）把顏色寫在 style 裡，
      // 例如 style="fill:rgb(255,0,0);stroke:none"，需一併處理
      const style = el.getAttribute('style');
      if (style) {
        const newStyle = style.replace(/(fill|stroke)\s*:\s*([^;]+)/gi, (match, prop, val) => {
          const newColor = pickColor(val);
          return newColor ? `${prop}:${newColor}` : match;
        });
        if (newStyle !== style) el.setAttribute('style', newStyle);
      }
    });
  }

  function updateSvgColorsAndDraw() {
    if (svgDom) {
      const cRed = document.getElementById('redColor').value;
      const cBlack = document.getElementById('blackColor').value;

      const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });

      // 外框重新光柵化，先前算出的內容偏移已失效
      frameOffsetCache = null;

  // ---- 放射狀邊緣延伸出血 ----
  // 不放大圖片本身，而是把 innerR（16mm裁切線）邊緣的像素顏色，
  // 沿著相同角度往外「複製貼上」到 outerR（18mm印刷邊界）為止，
  // 產生一圈貼齊原圖邊緣色調的出血環，裁切線以內的內容完全不受影響。
  function applyRadialEdgeBleed(ctx, cx, cy, innerR, outerR) {
    if (outerR <= innerR) return;

    const boxR = Math.ceil(outerR) + 1;
    const left = Math.max(0, Math.floor(cx - boxR));
    const top = Math.max(0, Math.floor(cy - boxR));
    const right = Math.min(ctx.canvas.width, Math.ceil(cx + boxR));
    const bottom = Math.min(ctx.canvas.height, Math.ceil(cy + boxR));
    const w = right - left;
    const h = bottom - top;
    if (w <= 0 || h <= 0) return;

    const imgData = ctx.getImageData(left, top, w, h);
    const data = imgData.data;

    // canvas 的 clip() 在邊界處會有約 1~2px 的反鋸齒（半透明漸層），
    // 若出血只從 innerR「以外」開始覆蓋，會留下這圈半透明像素沒被蓋到，
    // 底下的背景色透出來就變成一圈白色接縫。
    // 解法：出血範圍往「內」多蓋 OVERLAP_PX，蓋掉這圈反鋸齒；
    // 取樣位置則再往內縮一點，確保拿到的是完全不透明、乾淨的原圖顏色。
    const OVERLAP_PX = 2;
    const sampleR = Math.max(innerR - OVERLAP_PX - 1, 0);
    const paintStartR = innerR - OVERLAP_PX;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const px = (x + left) - cx;
        const py = (y + top) - cy;
        const dist = Math.sqrt(px * px + py * py);
        if (dist > paintStartR && dist <= outerR) {
          const angle = Math.atan2(py, px);
          let srcX = Math.round(cx + Math.cos(angle) * sampleR - left);
          let srcY = Math.round(cy + Math.sin(angle) * sampleR - top);
          srcX = Math.min(Math.max(srcX, 0), w - 1);
          srcY = Math.min(Math.max(srcY, 0), h - 1);

          const srcIdx = (srcY * w + srcX) * 4;
          const dstIdx = (y * w + x) * 4;
          data[dstIdx] = data[srcIdx];
          data[dstIdx + 1] = data[srcIdx + 1];
          data[dstIdx + 2] = data[srcIdx + 2];
          data[dstIdx + 3] = 255;
        }
      }
    }

    ctx.putImageData(imgData, left, top);
  }

  // ---- 偵測外框圖形的實際偏移與內圈開孔半徑 ----
  // 掃描光柵化後的不透明像素：
  //  1. 取內容範圍中心，算出相對圖檔中心的偏移比例（修正 CAD/AI 匯出的偏移）
  //  2. 從中心向外放射取樣，找出首次碰到圖形的距離 = 內圈開孔半徑
  // 這樣換外框時不必再手動調整常數。結果快取，只在外框重新載入時重算。
  function getFrameMetrics() {
    if (frameOffsetCache) return frameOffsetCache;
    const fallback = { dx: 0, dy: 0, innerR: FRAME_INNER_RADIUS_FALLBACK / 360 };
    try {
      const N = 240;
      const off = document.createElement('canvas');
      off.width = N; off.height = N;
      const octx = off.getContext('2d', { willReadFrequently: true });
      octx.drawImage(templateSvgImg, 0, 0, N, N);
      const data = octx.getImageData(0, 0, N, N).data;
      const opaque = (x, y) =>
        x >= 0 && y >= 0 && x < N && y < N && data[(y * N + x) * 4 + 3] > 8;

      let minX = N, minY = N, maxX = -1, maxY = -1;
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          if (opaque(x, y)) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return fallback;

      const ccx = (minX + maxX + 1) / 2;
      const ccy = (minY + maxY + 1) / 2;

      // 由內容中心向外放射掃描，取各角度首次碰到圖形距離的中位數；
      // 用中位數可忽略少數穿進內圈的裝飾線造成的偏差
      const hits = [];
      const RAYS = 72;
      const maxR = Math.min(maxX - ccx, ccx - minX, maxY - ccy, ccy - minY);
      for (let i = 0; i < RAYS; i++) {
        const a = (i / RAYS) * Math.PI * 2;
        const ux = Math.cos(a), uy = Math.sin(a);
        for (let r = 2; r <= maxR; r++) {
          if (opaque(Math.round(ccx + ux * r), Math.round(ccy + uy * r))) {
            hits.push(r);
            break;
          }
        }
      }
      hits.sort((a, b) => a - b);
      const innerRpx = hits.length ? hits[Math.floor(hits.length / 2)] : maxR;

      frameOffsetCache = {
        dx: (ccx - N / 2) / N,
        dy: (ccy - N / 2) / N,
        innerR: innerRpx / N
      };
      return frameOffsetCache;
    } catch (e) {
      return fallback;   // 光柵化失敗（例如跨來源限制）時維持預設值
    }
  }

  // 有外框時的內圈開孔半徑（換算到 360px 基準畫布）
  function frameInnerRadiusPx() {
    return getFrameMetrics().innerR * 360;
  }

  function drawSingleSticker(targetCtx, cx, cy, diameter) {
    const s = diameter / 360;
    const hideFrame = document.getElementById('hideFrameCheck').checked;

    // 全圖模式：一律以「16mm 實際裁切線」為基準圓，不是印刷邊界(18mm)，
    // 避免把裁切線以外的內容也當成有效可視範圍
    const innerR = hideFrame ? (cutRadiusPx() * s) : (frameInnerRadiusPx() * s);

    if (userImg) {
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
      targetCtx.clip();

      const offsetX = (imgState.x - 180) * s;
      const offsetY = (imgState.y - 180) * s;

      targetCtx.translate(cx + offsetX, cy + offsetY);
      targetCtx.rotate((imgState.angle * Math.PI) / 180);

      const finalScale = baseFitScale * userScaleMultiplier;
      const w = userImg.width * finalScale * s;
      const h = userImg.height * finalScale * s;
      targetCtx.drawImage(userImg, -w / 2, -h / 2, w, h);
      targetCtx.restore();

      if (hideFrame) {
        // 全圖模式一律自動出血（不再需要勾選）：
        // 出血不是把圖片放大（那樣會讓 16mm 以內的內容跟著跑掉／超出裁切線），
        // 而是把 16mm 裁切線邊緣的像素顏色，以放射狀方式往外「複製延伸」1mm，
        // 產生一圈不影響原圖內容、單純填補裁切誤差用的邊緣色出血。
        const bleedR = innerR + bleedMM() * pxPerMMSingle() * s;
        applyRadialEdgeBleed(targetCtx, cx, cy, innerR, bleedR);
      }
    } else {
      targetCtx.fillStyle = "#A0A0A0";
      targetCtx.beginPath();
      targetCtx.arc(cx, cy, innerR, 0, Math.PI * 2);
      targetCtx.fill();
    }

    if (!hideFrame && templateSvgImg.complete && templateSvgImg.naturalWidth !== 0) {
      // 依外框 SVG 的原始比例 contain-fit（不拉伸變形），
      // 但改用「實際圖形內容」的中心對齊，而非 viewBox 的中心——
      // 因為 CAD 匯出的 SVG 常有大片空白畫布、圖形偏在一角，
      // 若照 viewBox 置中，外框就會偏離格子中心，看起來像裁切圓沒對準。
      const boxSize = diameter;
      const fitScale = Math.min(boxSize / svgNaturalSize.w, boxSize / svgNaturalSize.h);
      const drawW = svgNaturalSize.w * fitScale;
      const drawH = svgNaturalSize.h * fitScale;
      const off = getFrameMetrics();
      targetCtx.drawImage(
        templateSvgImg,
        cx - drawW / 2 - off.dx * drawW,
        cy - drawH / 2 - off.dy * drawH,
        drawW, drawH
      );
    }
  }

  function drawSheetLayout(targetCtx, sheetWidth, sheetHeight) {
    targetCtx.clearRect(0, 0, sheetWidth, sheetHeight);
    targetCtx.fillStyle = "#FFFFFF";
    targetCtx.fillRect(0, 0, sheetWidth, sheetHeight);

    const rows = SHEET_ROWS;
    const cols = SHEET_COLS;

    // 以實際 mm 換算 px（傳入的 sheetWidth/sheetHeight 對應 4x6 吋，
    // 不論是預覽畫布或匯出畫布，換算比例皆一致）
    // 整張畫布 = ibon 實際印出的影像範圍。因檔案比例(1.5)高於紙張(1.48)，
    // 是「高度」先碰到可列印邊界，故以高度換算 mm，寬度自然依比例對應。
    const pxPerMM = sheetHeight / PRINT_AREA_HEIGHT_MM;

    const stickerDiameter = STICKER_PRINTED_DIAMETER_MM * pxPerMM;  // 印出來的實際直徑
    const insetPx = cutLineInsetMM() * pxPerMM;
    const rowGapPx = ROW_GAP_MM * pxPerMM;                          // 排與排之間的額外間距

    const stepX = stickerDiameter;
    const stepY = stickerDiameter + rowGapPx;

    // 剩餘空間平均分配為上下左右邊界。縱向總高需計入 (rows-1) 段間距。
    const totalHeight = rows * stickerDiameter + (rows - 1) * rowGapPx;
    const marginX = (sheetWidth - cols * stickerDiameter) / 2;
    const marginY = (sheetHeight - totalHeight) / 2;

    // 先繪製每張貼紙圖案。未派發的排完全不畫（含灰底佔位圓），
    // 讓預覽所見即所得，也避免佔位圖形被一起印出來。
    for (let r = 0; r < rows; r++) {
      const rowCanvas = savedRowCanvases[r];
      if (!rowCanvas) continue;
      for (let c = 0; c < cols; c++) {
        const cx = marginX + c * stepX + stickerDiameter / 2;
        const cy = marginY + r * stepY + stickerDiameter / 2;
        targetCtx.drawImage(rowCanvas, cx - stickerDiameter / 2, cy - stickerDiameter / 2, stickerDiameter, stickerDiameter);
      }
    }

    // 再疊上切刀對位線。未派發的排不畫線，避免空白處印出多餘線條。
    if (!document.getElementById('showCutLineCheck').checked) return;

    const filledRows = [];
    for (let r = 0; r < rows; r++) {
      if (savedRowCanvases[r]) filledRows.push(r);
    }
    if (filledRows.length === 0) return;   // 全空，整張不畫線

    targetCtx.save();
    targetCtx.strokeStyle = cutLineColorValue;
    // 線寬以「預覽畫布(400px寬)」為基準，需依實際畫布寬度等比放大，
    // 確保預覽看到的粗細與匯出的 1200px 檔案一致
    const lineW = Math.max(0.5, CUT_LINE_WIDTH_PX * (sheetWidth / 400));
    targetCtx.lineWidth = lineW;

    targetCtx.beginPath();

    if (document.getElementById('cutLineShape').value === 'circle') {
      // 圓形模式：讓線的「內緣」貼齊裁切直徑，成品尺寸才會剛好相符。
      // Canvas 的 stroke 是沿路徑置中描繪（各半在路徑內外），
      // 所以路徑半徑要往外推半個線寬，整條線才會完全落在裁切圓之外。
      const cutR = (CUT_CIRCLE_DIAMETER_MM / 2) * pxPerMM + lineW / 2;
      filledRows.forEach(r => {
        for (let c = 0; c < cols; c++) {
          const cx = marginX + c * stepX + stickerDiameter / 2;
          const cy = marginY + r * stepY + stickerDiameter / 2;
          targetCtx.moveTo(cx + cutR, cy);   // 移到起點，避免與前一個圓連成線
          targetCtx.arc(cx, cy, cutR, 0, Math.PI * 2);
        }
      });
    } else {
      // 直線格線模式：逐排畫出該排的裁切框線。
      // 不再貫穿整張紙，否則空白排也會被畫到；
      // 每排畫上下兩條橫線（該排圓形往內 1mm 的上下切線），
      // 直線則只在該排的高度範圍內延伸。
      filledRows.forEach(r => {
        const rowTop = marginY + r * stepY;
        const yTop = rowTop + insetPx;
        const yBottom = rowTop + stickerDiameter - insetPx;

        targetCtx.moveTo(0, yTop);
        targetCtx.lineTo(sheetWidth, yTop);
        targetCtx.moveTo(0, yBottom);
        targetCtx.lineTo(sheetWidth, yBottom);

        for (let c = 0; c <= cols; c++) {
          const x = (c < cols)
            ? marginX + c * stepX + insetPx
            : marginX + (cols - 1) * stepX + stickerDiameter - insetPx;
          targetCtx.moveTo(x, yTop);
          targetCtx.lineTo(x, yBottom);
        }
      });
    }

    targetCtx.stroke();
    targetCtx.restore();
  }

  // ---- 共用：在單張貼紙上疊繪裁切圓 ----
  // 預覽與打樣圖共用同一套幾何，確保畫面所見與輸出一致。
  // 線的「內緣」貼齊裁切直徑（stroke 為沿路徑置中描繪，故半徑外推半個線寬）。
  function drawCutCircleOverlay(targetCtx, cx, cy, stickerPx, color, lineW) {
    const ratio = CUT_CIRCLE_DIAMETER_MM / STICKER_PRINTED_DIAMETER_MM;
    const cutR = (stickerPx / 2) * ratio + lineW / 2;

    targetCtx.save();
    targetCtx.strokeStyle = color;
    targetCtx.lineWidth = lineW;
    // 虛線：避免被誤認為圖案本身的一部分
    targetCtx.setLineDash([stickerPx * 0.017, stickerPx * 0.011]);
    targetCtx.beginPath();
    targetCtx.arc(cx, cy, cutR, 0, Math.PI * 2);
    targetCtx.stroke();
    targetCtx.restore();
  }

  function draw() {
    if (currentMode === 'single') {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSingleSticker(ctx, 180, 180, 360);
      if (document.getElementById('showPreviewCutCheck').checked) {
        drawCutCircleOverlay(ctx, 180, 180, 360, proofLineColorValue, 1.5);
      }
    } else {
      drawSheetLayout(ctx, canvas.width, canvas.height);
    }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    // touchend 時 e.touches 可能為空清單，需退回 changedTouches
    const touch = (e.touches && e.touches.length) ? e.touches[0]
                : (e.changedTouches && e.changedTouches.length) ? e.changedTouches[0]
                : null;
    const clientX = touch ? touch.clientX : e.clientX;
    const clientY = touch ? touch.clientY : e.clientY;
    // canvas 內部解析度（360）與 CSS 顯示寬度在手機上不同（會被 max-width:100% 縮小），
    // 必須換算回 canvas 內部座標，否則拖曳時圖片會跑得比手指快
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function getPinchDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function startDrag(e) {
    if (!userImg || currentMode !== 'single') return;

    if (e.touches && e.touches.length === 2) {
      isDragging = false;
      initialPinchDist = getPinchDistance(e.touches);
      initialScaleMultiplier = userScaleMultiplier;
      return;
    }

    isDragging = true;
    const pos = getPos(e);
    startX = pos.x - imgState.x;
    startY = pos.y - imgState.y;
  }

  // 觸控事件觸發頻率可能高於螢幕更新率，若每次都同步重繪會累積延遲
  // （全圖模式的出血運算含 getImageData，成本更高）。改用 rAF 節流。
  let drawScheduled = false;
  function scheduleDraw() {
    if (drawScheduled) return;
    drawScheduled = true;
    requestAnimationFrame(() => {
      drawScheduled = false;
      draw();
    });
  }

  function moveDrag(e) {
    if (!userImg || currentMode !== 'single') return;

    if (e.touches && e.touches.length === 2 && initialPinchDist) {
      e.preventDefault();
      const currentDist = getPinchDistance(e.touches);
      const scaleFactor = currentDist / initialPinchDist;
      let newScale = initialScaleMultiplier * scaleFactor;

      newScale = Math.max(0.1, Math.min(3.0, newScale));
      userScaleMultiplier = newScale;

      syncScaleUI();
      scheduleDraw();
      return;
    }

    if (isDragging) {
      if (e.touches) e.preventDefault();
      const pos = getPos(e);
      imgState.x = pos.x - startX;
      imgState.y = pos.y - startY;
      syncPositionUI();
      scheduleDraw();
    }
  }

  function stopDrag(e) {
    // 雙指縮放後若只放開一指、另一指還按著，
    // 應無縫接回單指拖曳，而不是卡住直到全部放開
    if (e && e.touches && e.touches.length === 1 && userImg && currentMode === 'single') {
      initialPinchDist = null;
      isDragging = true;
      const pos = getPos(e);
      startX = pos.x - imgState.x;
      startY = pos.y - imgState.y;
      return;
    }
    isDragging = false;
    initialPinchDist = null;
  }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  canvas.addEventListener('mouseup', stopDrag);
  canvas.addEventListener('mouseleave', stopDrag);

  canvas.addEventListener('touchstart', startDrag, { passive: false });
  canvas.addEventListener('touchmove', moveDrag, { passive: false });
  canvas.addEventListener('touchend', stopDrag);

  // ---- 共用下載邏輯 ----
  // 用 Blob 而非 toDataURL：大尺寸 PNG 轉 base64 字串可達數 MB，
  // 手機瀏覽器容易因字串過長而失敗或當掉。
  function downloadCanvas(sourceCanvas, filename, mime = 'image/png', quality) {
    sourceCanvas.toBlob((blob) => {
      if (!blob) {
        alert('產生圖檔失敗，請再試一次。');
        return;
      }
      const url = URL.createObjectURL(blob);

      // iOS Safari 對 <a download> 支援不完整，常常直接開新分頁而非下載
      const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (isIOS) {
        const win = window.open(url, '_blank');
        if (!win) {
          alert('請允許彈出視窗，或改用電腦下載。');
        } else {
          alert('圖片已開啟於新分頁，請「長按圖片 → 加入照片」即可儲存。');
        }
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } else {
        const link = document.createElement('a');
        link.download = filename;
        link.href = url;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    }, mime, quality);
  }

  document.getElementById('downloadSheetBtn').addEventListener('click', () => {
    const outCanvas = document.createElement('canvas');
    // 4x6 相片標準尺寸（300dpi）：4in x 6in = 1200 x 1800 px
    outCanvas.width = 1200;
    outCanvas.height = 1800;
    drawSheetLayout(outCanvas.getContext('2d'), 1200, 1800);
    downloadCanvas(outCanvas, 'CX_Stickers_4x6_PrintSheet.png');
  });

  // ---- 單張貼紙打樣圖（給客戶確認用）----
  // 高解析度呈現一張貼紙，並疊上實際的裁切線，
  // 讓客戶一眼看出成品會裁成什麼樣子、哪些內容會被裁掉。
  // 不標註任何尺寸數字（屬內部資訊）。
  // ---- 打樣圖浮水印 ----
  // 僅用於「給客戶看」的打樣圖與比較圖；4x6 實際列印檔不會加，
  // 否則浮水印會被真的印在貼紙上。
  const WATERMARK_TEXT = 'N3D LAB';
  // circles: [{cx, cy, r}]，浮水印只畫在這些圓內；省略則鋪滿整張。
  function drawWatermark(ctx, w, h, circles) {
    ctx.save();

    // 先裁切到貼紙範圍，白底區域就不會有浮水印
    if (circles && circles.length) {
      ctx.beginPath();
      circles.forEach(c => {
        ctx.moveTo(c.cx + c.r, c.cy);   // 避免各圓之間被連成一條線
        ctx.arc(c.cx, c.cy, c.r, 0, Math.PI * 2);
      });
      ctx.clip();
    }

    // 貼紙有深有淺，單一顏色必有一種底看不見（純黑字會消失在深色環上）。
    // 用「白描邊 + 黑字」：深底靠白邊浮現、淺底靠黑字浮現，兩者皆可辨識。
    ctx.font = `bold ${Math.round(h * 0.038)}px -apple-system, "Helvetica Neue", Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, h * 0.002);
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.19)';

    // 傾斜鋪滿：先旋轉座標系，再以夠大的範圍平舖，確保旋轉後四角不留空
    const angle = -Math.PI / 6;   // -30 度
    ctx.translate(w / 2, h / 2);
    ctx.rotate(angle);

    const stepX = ctx.measureText(WATERMARK_TEXT).width * 1.5;
    const stepY = h * 0.092;
    const reach = Math.hypot(w, h);   // 旋轉後需覆蓋的半徑

    let row = 0;
    for (let y = -reach; y <= reach; y += stepY, row++) {
      // 每列交錯半格，避免形成整齊的直線通道
      const offset = (row % 2) * (stepX / 2);
      for (let x = -reach; x <= reach; x += stepX) {
        ctx.strokeText(WATERMARK_TEXT, x + offset, y);
        ctx.fillText(WATERMARK_TEXT, x + offset, y);
      }
    }
    ctx.restore();

    drawProofNotice(ctx, w, h);
  }

  // 右下角警語：避免客戶誤以為成品上會有浮水印。
  // 尺寸依畫布高度換算，單張(1200)與比較圖(3000x1000)都能維持相同視覺比例。
  const PROOF_NOTICE_TEXT = '※ 此為參考圖，正式成品並不會有浮水印';
  function drawProofNotice(ctx, w, h) {
    const fontSize = Math.round(h * 0.040);
    const padX = h * 0.026;
    const padY = h * 0.016;
    const margin = h * 0.025;

    ctx.save();
    ctx.font = `${fontSize}px -apple-system, "PingFang TC", "Noto Sans TC", sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';

    const textW = ctx.measureText(PROOF_NOTICE_TEXT).width;
    const boxW = textW + padX * 2;
    const boxH = fontSize + padY * 2;
    const boxX = w - margin - boxW;
    const boxY = h - margin - boxH;

    // 半透明底條，確保警語在任何底色上都讀得到
    ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.lineWidth = Math.max(1, h * 0.0012);
    const r = boxH / 2;
    ctx.beginPath();
    ctx.moveTo(boxX + r, boxY);
    ctx.lineTo(boxX + boxW - r, boxY);
    ctx.arcTo(boxX + boxW, boxY, boxX + boxW, boxY + r, r);
    ctx.lineTo(boxX + boxW, boxY + boxH - r);
    ctx.arcTo(boxX + boxW, boxY + boxH, boxX + boxW - r, boxY + boxH, r);
    ctx.lineTo(boxX + r, boxY + boxH);
    ctx.arcTo(boxX, boxY + boxH, boxX, boxY + boxH - r, r);
    ctx.lineTo(boxX, boxY + r);
    ctx.arcTo(boxX, boxY, boxX + r, boxY, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#444444';
    ctx.fillText(PROOF_NOTICE_TEXT, boxX + boxW - padX, boxY + padY + fontSize * 0.82);
    ctx.restore();
  }

  // ---- 三款比較打樣圖 ----
  // 同一張照片分別套上左迴旋、右迴旋、無外框，並排輸出供客戶挑選。
  // 需為每種外框各自光柵化一次 SVG（Image 載入是非同步），
  // 因此整個流程以 Promise 串接。
  function makeFrameImage(svgMarkup) {
    return new Promise((resolve, reject) => {
      const doc = new DOMParser().parseFromString(svgMarkup, 'image/svg+xml');
      const dom = doc.querySelector('svg');
      if (!dom) { reject(new Error('SVG 解析失敗')); return; }

      recolorFrameSvg(
        dom,
        document.getElementById('redColor').value,
        document.getElementById('blackColor').value,
        document.getElementById('whiteColor').value
      );

      const blob = new Blob([new XMLSerializer().serializeToString(dom)],
                            { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); resolve({ img, natural: getSvgNaturalSize(dom) }); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('外框載入失敗')); };
      img.src = url;
    });
  }

  document.getElementById('downloadCompareBtn').addEventListener('click', async () => {
    const btn = document.getElementById('downloadCompareBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '產生中…';

    // 暫時借用全域繪製狀態，結束後必須完整還原，
    // 否則畫面上的外框選擇與快取會被這次輸出汙染
    const savedImg = templateSvgImg;
    const savedSize = svgNaturalSize;
    const savedCache = frameOffsetCache;
    const hideCheck = document.getElementById('hideFrameCheck');
    const savedHide = hideCheck.checked;

    try {
      const CELL = 1000;
      const STICKER_PX = CELL * 0.74;
      // 底部額外加高，讓右下角警語不會壓到「無外框」等款式標籤
      const NOTICE_BAND = CELL * 0.12;
      const out = document.createElement('canvas');
      out.width = CELL * 3;
      out.height = CELL + NOTICE_BAND;
      const octx = out.getContext('2d', { willReadFrequently: true });
      octx.fillStyle = '#FFFFFF';
      octx.fillRect(0, 0, out.width, out.height);

      const lineW = Math.max(2, CELL * 0.002);
      const variants = [
        { key: 'left',  label: '左迴旋' },
        { key: 'right', label: '右迴旋' },
        { key: 'none',  label: '無外框' }
      ];

      // 有外框時照片只需填滿外框開孔，無外框時可視範圍是更大的裁切圓。
      // 若沿用同一份縮放，無外框那款會明顯偏小，故等比放大到相同視覺尺寸。
      let frameOpeningR = null;
      const wmCircles = [];   // 供浮水印裁切用
      const savedBaseFit = baseFitScale;
      const savedImgState = { ...imgState };

      for (let i = 0; i < variants.length; i++) {
        const v = variants[i];
        const cx = CELL * i + CELL / 2;
        const cy = CELL / 2 - CELL * 0.045;   // 上移，底部留出標註空間

        if (v.key === 'none') {
          hideCheck.checked = true;
          // 以「裁切圓 / 外框開孔」的比例等比放大，位移量同步放大以維持構圖
          if (frameOpeningR && userImg) {
            const ratio = cutRadiusPx() / frameOpeningR;
            baseFitScale = savedBaseFit * ratio;
            imgState.x = 180 + (savedImgState.x - 180) * ratio;
            imgState.y = 180 + (savedImgState.y - 180) * ratio;
          }
        } else {
          hideCheck.checked = false;
          const loaded = await makeFrameImage(FRAMES[v.key].svg);
          templateSvgImg = loaded.img;
          svgNaturalSize = loaded.natural;
          frameOffsetCache = null;   // 換了外框，置中偏移與內圈半徑需重算
          frameOpeningR = frameInnerRadiusPx();   // 記下開孔半徑，供無外框那款換算
        }

        drawSingleSticker(octx, cx, cy, STICKER_PX);
        drawCutCircleOverlay(octx, cx, cy, STICKER_PX, proofLineColorValue, lineW);
        wmCircles.push({ cx, cy, r: STICKER_PX / 2 });

        // 款式名稱（不含任何尺寸資訊）
        octx.save();
        octx.fillStyle = '#333333';
        octx.textAlign = 'center';
        octx.textBaseline = 'middle';
        octx.font = `600 ${Math.round(CELL * 0.062)}px -apple-system, "PingFang TC", "Noto Sans TC", sans-serif`;
        octx.fillText(v.label, cx, CELL - CELL * 0.085);
        octx.restore();
      }

      // 還原被暫時放大的縮放與位移
      baseFitScale = savedBaseFit;
      imgState.x = savedImgState.x;
      imgState.y = savedImgState.y;

      if (document.getElementById('watermarkCheck').checked) {
        drawWatermark(octx, out.width, out.height, wmCircles);
      }
      // 改輸出 JPEG：3000x1000 的 PNG 常超過 2MB，JPEG 可壓到十分之一以下。
      // 打樣圖已有白底，不受 JPEG 不支援透明的限制。
      downloadCanvas(out, 'CX_Sticker_Compare.jpg', 'image/jpeg', 0.92);
    } catch (err) {
      alert('產生比較圖失敗：' + err.message);
    } finally {
      // 無論成功或失敗都要還原，避免畫面狀態錯亂
      templateSvgImg = savedImg;
      svgNaturalSize = savedSize;
      frameOffsetCache = savedCache;
      hideCheck.checked = savedHide;
      btn.disabled = false;
      btn.textContent = originalText;
      draw();
    }
  });

  document.getElementById('downloadProofBtn').addEventListener('click', () => {
    const SIZE = 1200;                 // 輸出邊長
    const STICKER_PX = SIZE * 0.72;    // 貼紙佔比，四周留白便於檢視
    // 底部額外加高，讓右下角警語不會壓到貼紙圖案
    const NOTICE_BAND = SIZE * 0.1;
    const cx = SIZE / 2;
    const cy = SIZE / 2;

    const out = document.createElement('canvas');
    out.width = SIZE;
    out.height = SIZE + NOTICE_BAND;
    const octx = out.getContext('2d', { willReadFrequently: true });

    octx.fillStyle = '#FFFFFF';
    octx.fillRect(0, 0, SIZE, SIZE);

    drawSingleSticker(octx, cx, cy, STICKER_PX);

    // 裁切線：與預覽共用同一套幾何，確保所見即所得
    const lineW = Math.max(2, SIZE * 0.002);
    drawCutCircleOverlay(octx, cx, cy, STICKER_PX, proofLineColorValue, lineW);

    if (document.getElementById('watermarkCheck').checked) {
      drawWatermark(octx, out.width, out.height, [{ cx, cy, r: STICKER_PX / 2 }]);
    }
    downloadCanvas(out, 'CX_Sticker_Proof.jpg', 'image/jpeg', 0.92);
  });

  draw();
</script>
</body>
</html>
