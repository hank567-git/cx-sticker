<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #15181c; color: #e4e7ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    padding: 20px;
  }
  .card {
    background: #1f242a; border: 1px solid #3a424a; border-radius: 14px;
    padding: 32px 28px; width: 100%; max-width: 340px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;
  }
  h1 { font-size: 17px; margin: 0 0 22px; color: #e4e7ea; font-weight: 700; }
  input[type="password"] {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border: 1px solid #4a535c; border-radius: 8px;
    background: #2a3138; color: #e4e7ea; text-align: center; letter-spacing: 2px;
  }
  input[type="password"]:focus { outline: none; border-color: #4d9fff; }
  button {
    width: 100%; margin-top: 12px; padding: 12px; font-size: 15px; font-weight: bold;
    border: none; border-radius: 8px; background: #4d9fff; color: #0d1117; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:active:not(:disabled) { transform: scale(0.98); }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; color: #ff8a80; }
</style>

  const ITERATIONS = 300000;
  function b64ToBytes(b64) {
    const bin = atob(b64); const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  const pwInput = document.getElementById('pw');
  const goBtn = document.getElementById('go');
  const msg = document.getElementById('msg');
  async function tryUnlock() {
    const password = pwInput.value;
    if (!password) return;
    goBtn.disabled = true; pwInput.disabled = true;
    msg.style.color = '#98a1aa'; msg.textContent = '解密中…';
    try {
      const salt = b64ToBytes(SALT_B64), iv = b64ToBytes(IV_B64), ciphertext = b64ToBytes(CIPHERTEXT_B64);
      const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256' },
        baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
      const html = new TextDecoder().decode(plainBuf);
      document.open(); document.write(html); document.close();

      msg.style.color = '#ff8a80';
      msg.textContent = '密碼錯誤，請再試一次。';
      goBtn.disabled = false; pwInput.disabled = false;
      pwInput.value = ''; pwInput.focus();
    }

  pwInput.focus();
